version: "3.8"

services:
  # Evolution API - WhatsApp
  evolution:
    image: atendai/evolution-api:latest
    container_name: civilnobre-whatsapp
    restart: always
    ports:
      - "8080:8080"
    environment:
      - SERVER_URL=http://localhost:8080
      - AUTHENTICATION_TYPE=apikey
      - AUTHENTICATION_API_KEY=SUA_CHAVE_EVOLUTION_AQUI
      - QRCODE_LIMIT=30
      - WEBHOOK_GLOBAL_ENABLED=false
    volumes:
      - evolution_data:/evolution/instances

  # CRM Civilnobre
  crm:
    build: .
    container_name: civilnobre-crm
    restart: always
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - EVOLUTION_API_URL=http://evolution:8080
      - EVOLUTION_API_KEY=SUA_CHAVE_EVOLUTION_AQUI
      - EVOLUTION_INSTANCE=civilnobre
      - ANTHROPIC_API_KEY=SUA_CHAVE_ANTHROPIC_AQUI
      - HUMAN_PHONE=5531999999999
      - DASHBOARD_SECRET=SUA_SENHA_AQUI
      - DATABASE_URL=file:/app/data/civilnobre.db
    volumes:
      - crm_data:/app/data
    depends_on:
      - evolution

volumes:
  evolution_data:
  crm_data:
