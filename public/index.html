<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8" />
<title>Painel de Atendimento WhatsApp</title>
<style>
  :root { --green: #25D366; --dark: #075E54; --bg: #f0f2f5; }
  * { box-sizing: border-box; }
  body { font-family: Arial, sans-serif; margin: 0; background: var(--bg); color: #222; }
  header { background: var(--dark); color: white; padding: 10px 20px; display: flex; justify-content: space-between; align-items: center; }
  header h1 { font-size: 18px; margin: 0; }
  nav.tabs { display: flex; gap: 4px; padding: 0 20px; background: var(--dark); }
  nav.tabs button { background: transparent; color: #cdeee0; border: none; padding: 10px 14px; cursor: pointer; font-size: 13px; border-bottom: 3px solid transparent; }
  nav.tabs button.active { color: white; border-bottom: 3px solid var(--green); }
  .view { display: none; height: calc(100vh - 92px); overflow: hidden; }
  .view.active { display: flex; }

  .layout { display: grid; grid-template-columns: 320px 1fr 320px; width: 100%; }
  .panel { overflow-y: auto; border-right: 1px solid #ddd; background: white; }
  .panel:last-child { border-right: none; }
  .filters { padding: 10px; display: flex; gap: 6px; flex-wrap: wrap; border-bottom: 1px solid #eee; }
  select, input, button { padding: 6px; border-radius: 4px; border: 1px solid #ccc; font-size: 13px; }
  button { background: var(--green); color: white; border: none; cursor: pointer; }
  button:hover { opacity: .9; }
  .conv-item { padding: 10px 14px; border-bottom: 1px solid #eee; cursor: pointer; }
  .conv-item:hover { background: #f7f7f7; }
  .conv-item.active { background: #e8f8ee; }
  .badge { display: inline-block; font-size: 11px; padding: 2px 6px; border-radius: 10px; margin-right: 4px; color: white; }
  .b-aberta { background: #e74c3c; }
  .b-pendente { background: #f39c12; }
  .b-resolvida { background: #27ae60; }
  .b-cat { background: #3498db; }
  .b-fonte { background: #8e44ad; }
  .b-emp { background: #16a085; }
  .messages { display: flex; flex-direction: column; height: 100%; }
  .msg-list { flex: 1; overflow-y: auto; padding: 14px; }
  .msg { max-width: 60%; margin-bottom: 8px; padding: 8px 12px; border-radius: 8px; font-size: 14px; }
  .msg.inbound { background: white; align-self: flex-start; }
  .msg.outbound { background: #dcf8c6; align-self: flex-end; margin-left: auto; }
  .reply-box { display: flex; gap: 6px; padding: 10px; border-top: 1px solid #ddd; }
  .reply-box input { flex: 1; }
  .metrics { padding: 14px; overflow-y: auto; width: 100%; }
  .metric-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 10px; }
  .metric-card { background: white; border-radius: 6px; padding: 10px; box-shadow: 0 1px 2px rgba(0,0,0,.1); }
  .metric-card .value { font-size: 22px; font-weight: bold; }
  .metric-card .label { font-size: 12px; color: #666; }
  .quick-replies { padding: 10px; border-top: 1px solid #ddd; }
  .quick-replies button { margin: 2px; font-size: 11px; background: #34495e; }
  .conv-actions { padding: 8px 14px; display: flex; gap: 6px; border-bottom: 1px solid #ddd; flex-wrap: wrap; }

  .kanban { display: flex; gap: 10px; padding: 14px; overflow-x: auto; width: 100%; }
  .kanban-col { background: #e9ecef; border-radius: 8px; min-width: 240px; max-width: 240px; display: flex; flex-direction: column; }
  .kanban-col h3 { font-size: 13px; padding: 10px; margin: 0; background: #d8dde2; border-radius: 8px 8px 0 0; }
  .kanban-cards { padding: 8px; overflow-y: auto; flex: 1; }
  .kanban-card { background: white; border-radius: 6px; padding: 8px; margin-bottom: 8px; font-size: 12px; box-shadow: 0 1px 2px rgba(0,0,0,.1); }
  .kanban-card .name { font-weight: bold; }
  .kanban-card select { width: 100%; margin-top: 6px; font-size: 11px; }

  .empreendimentos { padding: 14px; width: 100%; overflow-y: auto; }
  .emp-row { display: flex; justify-content: space-between; align-items: center; padding: 8px; background: white; border-radius: 6px; margin-bottom: 6px; }
</style>
</head>
<body>
<header>
  <h1>Painel de Atendimento WhatsApp</h1>
  <span id="sla-info"></span>
</header>
<nav class="tabs">
  <button class="tab-btn active" data-view="conversas">Conversas</button>
  <button class="tab-btn" data-view="funil">Funil (Leads)</button>
  <button class="tab-btn" data-view="metricas">Métricas</button>
  <button class="tab-btn" data-view="empreendimentos">Empreendimentos</button>
</nav>

<div class="view active" id="view-conversas">
  <div class="layout">
    <div class="panel" id="conv-panel">
      <div class="filters">
        <select id="f-status">
          <option value="">Todos status</option>
          <option value="aberta">Aberta</option>
          <option value="pendente">Pendente</option>
          <option value="resolvida">Resolvida</option>
        </select>
        <select id="f-category">
          <option value="">Todas categorias</option>
          <option value="vendas">Vendas</option>
          <option value="suporte">Suporte</option>
          <option value="financeiro">Financeiro</option>
          <option value="sem_classificacao">Sem classificação</option>
        </select>
        <select id="f-empreendimento"><option value="">Todos empreendimentos</option></select>
        <select id="f-source"><option value="">Todas origens</option></select>
      </div>
      <div id="conv-list"></div>
    </div>

    <div class="panel messages">
      <div class="conv-actions" id="conv-actions" style="display:none;">
        <select id="status-select"></select>
        <select id="category-select"></select>
        <select id="agent-select"></select>
        <select id="funnel-select"></select>
        <select id="emp-select"></select>
        <select id="source-select"></select>
      </div>
      <div class="msg-list" id="msg-list"><p style="padding:20px;color:#888;">Selecione uma conversa</p></div>
      <div class="quick-replies" id="quick-replies"></div>
      <div class="reply-box">
        <input id="reply-input" placeholder="Digite uma resposta..." />
        <button id="send-btn">Enviar</button>
      </div>
    </div>

    <div class="panel metrics" id="metrics-mini"></div>
  </div>
</div>

<div class="view" id="view-funil">
  <div class="kanban" id="kanban"></div>
</div>

<div class="view" id="view-metricas">
  <div class="metrics">
    <div id="metrics-full" class="metric-grid"></div>
  </div>
</div>

<div class="view" id="view-empreendimentos">
  <div class="empreendimentos">
    <h3>Empreendimentos</h3>
    <div style="display:flex; gap:6px; margin-bottom:10px;">
      <input id="novo-emp-nome" placeholder="Nome do empreendimento" style="flex:1;" />
      <button id="add-emp-btn">Adicionar</button>
    </div>
    <div id="emp-list"></div>
  </div>
</div>

<script>
let currentConversation = null;
let FUNNEL_STAGES = [];
let SOURCES = [];
let EMPREENDIMENTOS = [];

async function api(path, opts) {
  const res = await fetch(path, opts);
  return res.json();
}

// --- Tabs ---
document.querySelectorAll('.tab-btn').forEach((btn) => {
  btn.onclick = () => {
    document.querySelectorAll('.tab-btn').forEach((b) => b.classList.remove('active'));
    document.querySelectorAll('.view').forEach((v) => v.classList.remove('active'));
    btn.classList.add('active');
    document.getElementById('view-' + btn.dataset.view).classList.add('active');
    if (btn.dataset.view === 'funil') loadKanban();
    if (btn.dataset.view === 'metricas') loadMetricsFull();
    if (btn.dataset.view === 'empreendimentos') loadEmpreendimentos();
  };
});

async function loadConstants() {
  const c = await api('/api/constants');
  FUNNEL_STAGES = c.FUNNEL_STAGES;
  SOURCES = c.SOURCES;
  EMPREENDIMENTOS = await api('/api/empreendimentos');

  document.getElementById('f-empreendimento').innerHTML += EMPREENDIMENTOS.map(e => `<option value="${e.id}">${e.nome}</option>`).join('');
  document.getElementById('f-source').innerHTML += SOURCES.map(s => `<option value="${s.id}">${s.label}</option>`).join('');
}

// --- Conversas ---
async function loadConversations() {
  const status = document.getElementById('f-status').value;
  const category = document.getElementById('f-category').value;
  const empreendimento_id = document.getElementById('f-empreendimento').value;
  const source = document.getElementById('f-source').value;
  const params = new URLSearchParams();
  if (status) params.set('status', status);
  if (category) params.set('category', category);
  if (empreendimento_id) params.set('empreendimento_id', empreendimento_id);
  if (source) params.set('source', source);
  const list = await api('/api/conversations?' + params.toString());
  const el = document.getElementById('conv-list');
  el.innerHTML = list.map(c => `
    <div class="conv-item" data-id="${c.id}" onclick="openConversation(${c.id})">
      <strong>${c.contact_name || c.wa_id}</strong><br/>
      <span class="badge b-${c.status}">${c.status}</span>
      <span class="badge b-cat">${c.category}</span>
      ${c.empreendimento_nome ? `<span class="badge b-emp">${c.empreendimento_nome}</span>` : ''}
      <span class="badge b-fonte">${(SOURCES.find(s=>s.id===c.source)||{}).label || c.source}</span>
      <div style="font-size:11px;color:#888;">${c.agent_name || 'sem agente'} · ${c.last_message_at || ''}</div>
    </div>`).join('') || '<p style="padding:14px;color:#888;">Nenhuma conversa</p>';
}

async function openConversation(id) {
  currentConversation = id;
  document.querySelectorAll('.conv-item').forEach(e => e.classList.toggle('active', e.dataset.id === String(id)));
  document.getElementById('conv-actions').style.display = 'flex';

  const conv = (await api('/api/conversations')).find(c => c.id === id);

  const statusSel = document.getElementById('status-select');
  statusSel.innerHTML = ['aberta','pendente','resolvida'].map(s => `<option value="${s}" ${s===conv.status?'selected':''}>${s}</option>`).join('');
  statusSel.onchange = async () => { await api(`/api/conversations/${id}/status`, {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({status: statusSel.value})}); loadConversations(); };

  const catSel = document.getElementById('category-select');
  catSel.innerHTML = ['vendas','suporte','financeiro','sem_classificacao'].map(s => `<option value="${s}" ${s===conv.category?'selected':''}>${s}</option>`).join('');
  catSel.onchange = async () => { await api(`/api/conversations/${id}/category`, {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({category: catSel.value})}); loadConversations(); };

  const agents = await api('/api/agents');
  const agentSel = document.getElementById('agent-select');
  agentSel.innerHTML = '<option value="">Sem agente</option>' + agents.map(a => `<option value="${a.id}" ${a.id===conv.agent_id?'selected':''}>${a.name}</option>`).join('');
  agentSel.onchange = async () => { await api(`/api/conversations/${id}/assign`, {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({agent_id: agentSel.value || null})}); loadConversations(); };

  const funnelSel = document.getElementById('funnel-select');
  funnelSel.innerHTML = FUNNEL_STAGES.map(s => `<option value="${s.id}" ${s.id===conv.funnel_stage?'selected':''}>${s.label}</option>`).join('');
  funnelSel.onchange = async () => { await api(`/api/conversations/${id}/funnel`, {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({funnel_stage: funnelSel.value})}); loadConversations(); };

  const empSel = document.getElementById('emp-select');
  empSel.innerHTML = '<option value="">Sem empreendimento</option>' + EMPREENDIMENTOS.map(e => `<option value="${e.id}" ${e.id===conv.empreendimento_id?'selected':''}>${e.nome}</option>`).join('');
  empSel.onchange = async () => { await api(`/api/conversations/${id}/empreendimento`, {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({empreendimento_id: empSel.value || null})}); loadConversations(); };

  const sourceSel = document.getElementById('source-select');
  sourceSel.innerHTML = SOURCES.map(s => `<option value="${s.id}" ${s.id===conv.source?'selected':''}>${s.label}</option>`).join('');
  sourceSel.onchange = async () => { await api(`/api/conversations/${id}/source`, {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({source: sourceSel.value})}); loadConversations(); };

  await loadMessages(id);
}

async function loadMessages(id) {
  const msgs = await api(`/api/conversations/${id}/messages`);
  const el = document.getElementById('msg-list');
  el.innerHTML = msgs.map(m => `<div class="msg ${m.direction}">${m.body}</div>`).join('') || '<p style="color:#888;">Sem mensagens</p>';
  el.scrollTop = el.scrollHeight;
}

async function loadQuickReplies() {
  const quickReplies = await api('/api/quick-replies');
  document.getElementById('quick-replies').innerHTML = quickReplies.map(q =>
    `<button onclick="document.getElementById('reply-input').value=${JSON.stringify(q.body)}">${q.shortcut}</button>`
  ).join('');
}

document.getElementById('send-btn').onclick = async () => {
  if (!currentConversation) return alert('Selecione uma conversa');
  const input = document.getElementById('reply-input');
  if (!input.value.trim()) return;
  const result = await api(`/api/conversations/${currentConversation}/reply`, {
    method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify({body: input.value})
  });
  if (result.error) return alert(result.error);
  input.value = '';
  await loadMessages(currentConversation);
  await loadConversations();
};

['f-status','f-category','f-empreendimento','f-source'].forEach(id => {
  document.getElementById(id).onchange = loadConversations;
});

// --- Métricas (mini, painel direito da aba Conversas) ---
async function loadMetricsMini() {
  const m = await api('/api/metrics');
  document.getElementById('sla-info').textContent = `SLA: ${m.slaMinutos} min · Atrasadas: ${m.atrasadas}`;
  document.getElementById('metrics-mini').innerHTML = `
    <div class="metric-card"><div class="value">${m.total}</div><div class="label">Total de conversas</div></div>
    <div class="metric-card"><div class="value">${m.totalAbertas}</div><div class="label">Abertas</div></div>
    <div class="metric-card"><div class="value">${m.totalPendentes}</div><div class="label">Pendentes</div></div>
    <div class="metric-card"><div class="value">${m.totalResolvidas}</div><div class="label">Resolvidas</div></div>
    <div class="metric-card"><div class="value">${m.tempoMedioRespostaMin ?? '-'} min</div><div class="label">Tempo médio até 1ª resposta</div></div>
    <div class="metric-card"><div class="value" style="color:#e74c3c;">${m.atrasadas}</div><div class="label">Fora do SLA</div></div>
  `;
}

// --- Métricas completas ---
async function loadMetricsFull() {
  const m = await api('/api/metrics');
  const el = document.getElementById('metrics-full');
  el.innerHTML = `
    <div class="metric-card"><div class="value">${m.total}</div><div class="label">Total de conversas</div></div>
    <div class="metric-card"><div class="value">${m.taxaResolucao}%</div><div class="label">Taxa de resolução</div></div>
    <div class="metric-card"><div class="value">${m.taxaConversaoFunil}%</div><div class="label">Conversão do funil (ganho/total)</div></div>
    <div class="metric-card"><div class="value">${m.tempoMedioRespostaMin ?? '-'} min</div><div class="label">Tempo médio até 1ª resposta</div></div>
    <div class="metric-card"><div class="value">${m.tempoMedioResolucaoMin ?? '-'} min</div><div class="label">Tempo médio de atendimento</div></div>
    <div class="metric-card"><div class="value" style="color:#e74c3c;">${m.atrasadas}</div><div class="label">Fora do SLA (${m.slaMinutos} min)</div></div>
    <div class="metric-card">
      <div class="label">Leads por etapa do funil</div>
      ${m.porFunil.map(f => `<div>${(FUNNEL_STAGES.find(s=>s.id===f.funnel_stage)||{}).label || f.funnel_stage}: <strong>${f.total}</strong></div>`).join('')}
    </div>
    <div class="metric-card">
      <div class="label">Origem dos leads</div>
      ${m.porFonte.map(f => `<div>${(SOURCES.find(s=>s.id===f.source)||{}).label || f.source}: <strong>${f.total}</strong></div>`).join('')}
    </div>
    <div class="metric-card">
      <div class="label">Por empreendimento</div>
      ${m.porEmpreendimento.map(e => `<div>${e.empreendimento}: <strong>${e.total}</strong> leads (${e.ganhos} ganhos)</div>`).join('') || '<div style="color:#888;">Sem dados ainda</div>'}
    </div>
    <div class="metric-card">
      <div class="label">Por categoria de atendimento</div>
      ${m.porCategoria.map(c => `<div>${c.category}: <strong>${c.total}</strong></div>`).join('')}
    </div>
    <div class="metric-card">
      <div class="label">Volume últimos 14 dias</div>
      ${m.volumePorDia.map(v => `<div>${v.dia}: <strong>${v.total}</strong></div>`).join('')}
    </div>
  `;
}

// --- Funil Kanban ---
async function loadKanban() {
  const conversations = await api('/api/conversations');
  const kanban = document.getElementById('kanban');
  kanban.innerHTML = FUNNEL_STAGES.map(stage => {
    const cards = conversations.filter(c => c.funnel_stage === stage.id);
    return `
      <div class="kanban-col">
        <h3>${stage.label} (${cards.length})</h3>
        <div class="kanban-cards">
          ${cards.map(c => `
            <div class="kanban-card">
              <div class="name">${c.contact_name || c.wa_id}</div>
              <div>${c.empreendimento_nome ? '🏗 ' + c.empreendimento_nome : 'sem empreendimento'}</div>
              <div style="color:#888;">${(SOURCES.find(s=>s.id===c.source)||{}).label || c.source}</div>
              <select onchange="moverFunil(${c.id}, this.value)">
                ${FUNNEL_STAGES.map(s => `<option value="${s.id}" ${s.id===c.funnel_stage?'selected':''}>${s.label}</option>`).join('')}
              </select>
            </div>
          `).join('')}
        </div>
      </div>
    `;
  }).join('');
}

async function moverFunil(id, funnel_stage) {
  await api(`/api/conversations/${id}/funnel`, {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({funnel_stage})});
  loadKanban();
}

// --- Empreendimentos ---
async function loadEmpreendimentos() {
  EMPREENDIMENTOS = await api('/api/empreendimentos');
  document.getElementById('emp-list').innerHTML = EMPREENDIMENTOS.map(e => `
    <div class="emp-row">
      <span>${e.nome}</span>
      <label><input type="checkbox" ${e.ativo ? 'checked' : ''} onchange="toggleEmp(${e.id}, this.checked)" /> Ativo</label>
    </div>
  `).join('') || '<p style="color:#888;">Nenhum empreendimento cadastrado</p>';
}

async function toggleEmp(id, ativo) {
  await api(`/api/empreendimentos/${id}/ativo`, {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ativo})});
}

document.getElementById('add-emp-btn').onclick = async () => {
  const input = document.getElementById('novo-emp-nome');
  if (!input.value.trim()) return;
  await api('/api/empreendimentos', {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({nome: input.value})});
  input.value = '';
  await loadEmpreendimentos();
  await loadConstants();
};

async function init() {
  await loadConstants();
  await loadConversations();
  await loadQuickReplies();
  await loadMetricsMini();
  setInterval(() => { loadConversations(); loadMetricsMini(); }, 15000);
}
init();
</script>
</body>
</html>
