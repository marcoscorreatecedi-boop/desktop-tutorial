name: Publicar app no GitHub Pages

on:
  push:
    branches:
      - claude/granite-order-management-b5odph
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configurar Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Empacotar app
        uses: actions/upload-pages-artifact@v3
        with:
          path: app
      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4
